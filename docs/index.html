<body>
<style>
/* Дорожная карта ОП — ДГУ. Все стили изолированы внутри #dgu-roadmap. */
#dgu-roadmap {
  --rm-blue: #024ABB;
  --rm-blue-2: #0050CF;
  --rm-navy: #1B3A6B;
  --rm-ink: #1E2A3B;
  --rm-muted: #5B6B82;
  --rm-faint: #8A97AB;
  --rm-line: #E1E7F0;
  --rm-bg: #F5F8FD;
  --rm-sky: #EEF5FF;
  --rm-white: #FFFFFF;
  --rm-radius: 14px;
  --rm-label: 116px;
  --rm-lane-min: 138px;
  --rm-gap: 8px;
  font-family: Geometria, "Montserrat", Arial, "Helvetica Neue", sans-serif;
  font-size: 15px;
  font-weight: 300; /* на dgu.ru «Geometria Regular» подключена как вес 300 */
  line-height: 1.45;
  color: var(--rm-ink);
  max-width: 1320px;
  margin: 0 auto;
  padding: 28px 20px 48px;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
}
#dgu-roadmap *, #dgu-roadmap *::before, #dgu-roadmap *::after { box-sizing: border-box; }
#dgu-roadmap button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
#dgu-roadmap button:focus-visible, #dgu-roadmap a:focus-visible, #dgu-roadmap input:focus-visible {
  outline: 2px solid var(--rm-blue-2); outline-offset: 2px;
}
#dgu-roadmap a { color: var(--rm-blue); text-decoration: none; }
#dgu-roadmap h1, #dgu-roadmap h2, #dgu-roadmap h3, #dgu-roadmap p, #dgu-roadmap ul { margin: 0; padding: 0; }
#dgu-roadmap ul { list-style: none; }
#dgu-roadmap li::before, #dgu-roadmap li::marker { content: none; }

/* ---------- Шапка ---------- */
#dgu-roadmap .rm-head { background: var(--rm-white); border-radius: 20px; padding: 28px 32px; border: 1px solid var(--rm-line); }
#dgu-roadmap .rm-eyebrow { font-size: 13px; color: var(--rm-muted); }
#dgu-roadmap .rm-title { font-size: 34px; line-height: 1.15; font-weight: 600; color: var(--rm-navy); margin-top: 6px !important; letter-spacing: -0.01em; }
#dgu-roadmap .rm-switch { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--rm-sky); padding: 4px; border-radius: 12px; margin-top: 18px; }
#dgu-roadmap .rm-switch button { padding: 9px 16px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--rm-navy); white-space: nowrap; transition: background .15s, color .15s; }
#dgu-roadmap .rm-switch button:hover { background: rgba(2, 74, 187, .08); }
#dgu-roadmap .rm-switch button[aria-selected="true"] { background: var(--rm-blue); color: #fff; }
#dgu-roadmap .rm-switch button small { font-weight: 300; opacity: .8; margin-left: 4px; }
#dgu-roadmap .rm-program { margin-top: 16px; }
#dgu-roadmap .rm-program-name { font-size: 20px; font-weight: 600; color: var(--rm-navy); }
#dgu-roadmap .rm-program-profile { font-size: 15px; color: var(--rm-muted); margin-top: 2px; }
#dgu-roadmap .rm-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; margin-top: 20px !important; }
#dgu-roadmap .rm-stats li { background: var(--rm-bg); border-radius: 12px; padding: 12px 14px; }
#dgu-roadmap .rm-stats b { display: block; font-size: 24px; line-height: 1.1; font-weight: 600; color: var(--rm-blue); }
#dgu-roadmap .rm-stats span { font-size: 13px; color: var(--rm-muted); }
#dgu-roadmap .rm-links { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 16px; font-size: 14px; }
#dgu-roadmap .rm-links a { display: inline-flex; align-items: center; gap: 6px; }
#dgu-roadmap .rm-links a:hover { text-decoration: underline; }
#dgu-roadmap .rm-links svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Панель и фильтры ---------- */
#dgu-roadmap .rm-panel { background: var(--rm-white); border-radius: 20px; padding: 22px 24px 24px; border: 1px solid var(--rm-line); margin-top: 16px; }
#dgu-roadmap .rm-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
#dgu-roadmap .rm-tracks { display: flex; flex-wrap: wrap; gap: 6px; }
#dgu-roadmap .rm-chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--rm-line); font-size: 13.5px; color: var(--rm-ink); background: var(--rm-white); white-space: nowrap; transition: border-color .15s, background .15s; }
#dgu-roadmap .rm-chip:hover { border-color: #C5D1E3; }
#dgu-roadmap .rm-chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--rm-blue)); flex: none; }
#dgu-roadmap .rm-chip[aria-pressed="true"] { background: var(--t, var(--rm-sky)); border-color: var(--c, var(--rm-blue)); color: var(--d, var(--rm-navy)); font-weight: 500; }
#dgu-roadmap .rm-search { position: relative; display: flex; align-items: center; min-width: 220px; flex: 0 1 280px; }
#dgu-roadmap .rm-search svg { position: absolute; left: 12px; width: 16px; height: 16px; fill: none; stroke: var(--rm-faint); stroke-width: 2; stroke-linecap: round; }
#dgu-roadmap .rm-search input { width: 100%; height: 38px; border: 1px solid var(--rm-line); border-radius: 999px; padding: 0 14px 0 36px; font: inherit; font-size: 14px; color: var(--rm-ink); background: var(--rm-bg); }
#dgu-roadmap .rm-search input:focus { background: var(--rm-white); border-color: var(--rm-blue-2); outline: none; }
#dgu-roadmap .rm-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; font-size: 12.5px; color: var(--rm-muted); }
#dgu-roadmap .rm-legend span { display: inline-flex; align-items: center; gap: 7px; }
#dgu-roadmap .rm-lg { display: inline-block; width: 22px; height: 14px; border-radius: 5px; }
#dgu-roadmap .rm-lg--card { background: #fff; border: 1px solid #CBD5E1; box-shadow: inset 0 3px 0 #94A3B8; }
#dgu-roadmap .rm-lg--choice { background: #F8FAFC; border: 1.5px dashed #94A3B8; }
#dgu-roadmap .rm-lg--practice { background: #DCF5E3; border: 1px solid #A7E3BA; }
#dgu-roadmap .rm-lg--optional { background: #fff; border: 1.5px dotted #94A3B8; }
#dgu-roadmap .rm-lg--arrow { height: 2px; border-radius: 2px; background: #94A3B8; position: relative; }
#dgu-roadmap .rm-lg--arrow::after { content: ""; position: absolute; right: -2px; top: -4px; border: 5px solid transparent; border-left: 7px solid #94A3B8; border-right: 0; }
#dgu-roadmap .rm-hint { font-size: 13px; color: var(--rm-faint); margin-top: 8px !important; }
#dgu-roadmap .rm-focusbar { position: sticky; top: 12px; z-index: 6; box-shadow: 0 6px 20px rgba(27, 58, 107, .14); display: none; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding: 8px 8px 8px 14px; background: var(--rm-sky); border-radius: 12px; font-size: 13.5px; color: var(--rm-navy); }
#dgu-roadmap.rm--pinned .rm-focusbar { display: flex; }
#dgu-roadmap .rm-btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 500; transition: background .15s, color .15s, border-color .15s; }
#dgu-roadmap .rm-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#dgu-roadmap .rm-btn--primary { background: var(--rm-blue); color: #fff; }
#dgu-roadmap .rm-btn--primary:hover { background: #003B98; }
#dgu-roadmap .rm-btn--outline { border: 1.5px solid var(--rm-blue); color: var(--rm-blue); }
#dgu-roadmap .rm-btn--outline:hover { background: var(--rm-sky); }
#dgu-roadmap .rm-btn--ghost { color: var(--rm-blue); padding: 6px 12px; }
#dgu-roadmap .rm-btn--ghost:hover { background: rgba(2, 74, 187, .08); }

/* ---------- Дерево ---------- */
#dgu-roadmap .rm-scroll { margin-top: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 16px; }
#dgu-roadmap .rm-tree { position: relative; min-width: calc(var(--rm-label) + var(--rm-lanes, 7) * var(--rm-lane-min)); }
#dgu-roadmap .rm-edges { position: absolute; left: 0; top: 0; z-index: 0; overflow: visible; pointer-events: none; }
#dgu-roadmap .rm-grid { position: relative; z-index: 1; display: grid; grid-template-columns: var(--rm-label) repeat(var(--rm-lanes, 7), minmax(var(--rm-lane-min), 1fr)); }
#dgu-roadmap .rm-lanehead { padding: 10px 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
#dgu-roadmap .rm-lanehead b { font-size: 13px; font-weight: 600; color: var(--d); line-height: 1.2; }
#dgu-roadmap .rm-lanehead span { font-size: 11.5px; color: var(--rm-faint); }
#dgu-roadmap .rm-lanehead i { width: 26px; height: 6px; border-radius: 3px; background: var(--c); }
#dgu-roadmap .rm-corner { position: sticky; left: 0; z-index: 3; background: var(--rm-white); }
#dgu-roadmap .rm-rowlabel { position: sticky; left: 0; z-index: 3; background: var(--rm-white); padding: 14px 10px 14px 4px; border-top: 1px solid var(--rm-line); }
#dgu-roadmap .rm-rowlabel.rm-course { border-top: 2px solid #C9D6EA; }
#dgu-roadmap .rm-rowlabel b { display: block; font-size: 15px; font-weight: 600; color: var(--rm-navy); line-height: 1.2; }
#dgu-roadmap .rm-rowlabel span { display: block; font-size: 12px; color: var(--rm-muted); margin-top: 2px; }
#dgu-roadmap .rm-rowlabel em { display: inline-block; font-style: normal; font-size: 11.5px; color: var(--rm-blue); background: var(--rm-sky); border-radius: 6px; padding: 1px 6px; margin-top: 6px; }
#dgu-roadmap .rm-rowlabel--final b { color: #14532D; }
#dgu-roadmap .rm-cell { padding: 12px 6px; display: flex; flex-direction: column; gap: var(--rm-gap); border-top: 1px solid var(--rm-line); min-width: 0; }
#dgu-roadmap .rm-cell.rm-course { border-top: 2px solid #C9D6EA; }

#dgu-roadmap .rm-card { position: relative; display: flex; flex-direction: column; gap: 6px; width: 100%; background: var(--rm-white); border: 1px solid var(--rm-line); border-radius: var(--rm-radius); padding: 11px 12px 10px; box-shadow: inset 0 3px 0 var(--c); transition: transform .15s, box-shadow .15s, opacity .2s, border-color .15s; }
#dgu-roadmap button.rm-card:hover, #dgu-roadmap .rm-opt:hover { border-color: var(--c); box-shadow: inset 0 3px 0 var(--c), 0 6px 18px rgba(27, 58, 107, .12); transform: translateY(-1px); }
#dgu-roadmap .rm-card-name, #dgu-roadmap .rm-opt { -webkit-hyphens: auto; hyphens: auto; overflow-wrap: break-word; }
#dgu-roadmap .rm-card-name { font-size: 13.5px; line-height: 1.3; font-weight: 500; color: var(--rm-ink); }
#dgu-roadmap .rm-card-meta { display: flex; flex-wrap: wrap; gap: 4px; font-size: 11.5px; color: var(--rm-muted); }
#dgu-roadmap .rm-pill { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--rm-bg); white-space: nowrap; }
#dgu-roadmap .rm-pill--c { background: var(--t); color: var(--d); }
#dgu-roadmap .rm-pill--exam { background: #FFF1E0; color: #9A4A00; }
#dgu-roadmap .rm-card--practice { background: var(--t); border-color: transparent; box-shadow: none; }
#dgu-roadmap .rm-card--practice .rm-card-name { color: var(--d); }
#dgu-roadmap .rm-card--practice .rm-pill { background: rgba(255, 255, 255, .7); }
#dgu-roadmap .rm-card--gia { background: var(--c); border-color: var(--c); box-shadow: none; }
#dgu-roadmap .rm-card--gia .rm-card-name { color: #fff; }
#dgu-roadmap .rm-card--gia .rm-pill { background: rgba(255, 255, 255, .2); color: #fff; }
#dgu-roadmap button.rm-card--gia:hover { box-shadow: 0 6px 18px rgba(20, 83, 45, .25); }
#dgu-roadmap .rm-card--optional { border: 1.5px dotted #A9B6C9; box-shadow: none; }
#dgu-roadmap .rm-card--compact { padding: 7px 10px 6px; gap: 2px; border-radius: 11px; box-shadow: none; border-color: #E6EAF0; }
#dgu-roadmap .rm-card--compact .rm-card-name { font-size: 12.5px; font-weight: 300; line-height: 1.25; }
#dgu-roadmap .rm-card--compact .rm-card-meta { font-size: 11px; color: var(--rm-faint); display: block; }
#dgu-roadmap .rm-card--choice { background: #FAFBFD; border: 1.5px dashed var(--c); box-shadow: none; padding: 9px 8px 8px; gap: 5px; }
#dgu-roadmap .rm-choice-head { display: flex; justify-content: space-between; gap: 6px; font-size: 11.5px; color: var(--d); font-weight: 500; padding: 0 3px; }
#dgu-roadmap .rm-choice-head span { color: var(--rm-muted); font-weight: 300; white-space: nowrap; }
#dgu-roadmap .rm-opt { display: block; width: 100%; background: var(--rm-white); border: 1px solid var(--rm-line); border-radius: 10px; padding: 7px 9px; font-size: 12.5px; line-height: 1.3; color: var(--rm-ink); transition: border-color .15s, box-shadow .15s, transform .15s; }
#dgu-roadmap .rm-or { font-size: 11px; color: var(--rm-faint); text-align: center; line-height: 1; }

/* Подсветка и фильтры */
#dgu-roadmap .rm-edge { fill: none; stroke-width: 1.6; opacity: .55; transition: opacity .2s, stroke-width .2s; }
#dgu-roadmap .rm-dim .rm-card, #dgu-roadmap .rm-dim .rm-card--choice { opacity: .22; }
#dgu-roadmap .rm-dim .rm-card.is-on { opacity: 1; }
#dgu-roadmap .rm-dim .rm-edge { opacity: .06; }
#dgu-roadmap .rm-dim .rm-edge.is-on { opacity: 1; stroke-width: 2.4; }
#dgu-roadmap .rm-card.is-self { border-color: var(--c); box-shadow: 0 0 0 3px var(--t), inset 0 3px 0 var(--c); }
#dgu-roadmap .rm-card.is-match { border-color: var(--rm-blue-2); box-shadow: 0 0 0 3px #CFE0FF; }

/* ---------- Модальное окно ---------- */
#dgu-roadmap .rm-modal { position: fixed; inset: 0; z-index: 10000; display: none; align-items: center; justify-content: center; padding: 24px; }
#dgu-roadmap .rm-modal.is-open { display: flex; }
#dgu-roadmap .rm-modal-backdrop { position: absolute; inset: 0; background: rgba(16, 32, 64, .45); animation: rm-fade .18s ease-out; }
#dgu-roadmap .rm-modal-panel { position: relative; width: 100%; max-width: 640px; max-height: calc(100vh - 48px); overflow-y: auto; background: var(--rm-white); border-radius: 20px; box-shadow: 0 24px 64px rgba(16, 32, 64, .28); animation: rm-pop .2s ease-out; outline: none; }
@keyframes rm-fade { from { opacity: 0; } }
@keyframes rm-pop { from { opacity: 0; transform: translateY(12px) scale(.98); } }
#dgu-roadmap .rm-m-top { height: 8px; background: var(--c); border-radius: 20px 20px 0 0; }
#dgu-roadmap .rm-m-body { padding: 20px 26px 26px; }
#dgu-roadmap .rm-m-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
#dgu-roadmap .rm-m-tags { display: flex; flex-wrap: wrap; gap: 6px; }
#dgu-roadmap .rm-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--rm-bg); color: var(--rm-muted); }
#dgu-roadmap .rm-tag--c { background: var(--t); color: var(--d); font-weight: 500; }
#dgu-roadmap .rm-tag--c i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
#dgu-roadmap .rm-close { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--rm-muted); margin: -4px -8px 0 0 !important; }
#dgu-roadmap .rm-close:hover { background: var(--rm-bg); color: var(--rm-ink); }
#dgu-roadmap .rm-close svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
#dgu-roadmap .rm-m-code { font-size: 12.5px; color: var(--rm-faint); margin-top: 14px; }
#dgu-roadmap .rm-m-title { font-size: 23px; line-height: 1.25; font-weight: 600; color: var(--rm-navy); margin-top: 4px !important; }
#dgu-roadmap .rm-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
#dgu-roadmap .rm-fact { background: var(--rm-bg); border-radius: 12px; padding: 10px 12px; }
#dgu-roadmap .rm-fact span { display: block; font-size: 12px; color: var(--rm-muted); }
#dgu-roadmap .rm-fact b { display: block; font-size: 15px; font-weight: 600; color: var(--rm-ink); margin-top: 2px; line-height: 1.3; }
#dgu-roadmap .rm-sec { margin-top: 20px; }
#dgu-roadmap .rm-sec-title { font-size: 13px; font-weight: 600; color: var(--rm-muted); margin-bottom: 8px; }
#dgu-roadmap .rm-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--rm-bg); gap: 2px; }
#dgu-roadmap .rm-bar i { display: block; height: 100%; }
#dgu-roadmap .rm-bar-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12.5px; color: var(--rm-muted); }
#dgu-roadmap .rm-bar-legend span { display: inline-flex; align-items: center; gap: 6px; }
#dgu-roadmap .rm-bar-legend i { width: 9px; height: 9px; border-radius: 3px; }
#dgu-roadmap .rm-bar-legend b { color: var(--rm-ink); font-weight: 600; }
#dgu-roadmap .rm-sems { display: grid; gap: 6px; }
#dgu-roadmap .rm-semrow { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; font-size: 13.5px; padding: 8px 12px; border-radius: 10px; background: var(--rm-bg); }
#dgu-roadmap .rm-semrow b { font-weight: 600; color: var(--rm-navy); }
#dgu-roadmap .rm-semrow span { color: var(--rm-muted); font-size: 12.5px; }
#dgu-roadmap .rm-semrow em { font-style: normal; font-size: 12px; color: var(--rm-ink); white-space: nowrap; }
#dgu-roadmap .rm-choicebox { background: var(--rm-sky); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; color: var(--rm-navy); }
#dgu-roadmap .rm-choicebox button { color: var(--rm-blue); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
#dgu-roadmap .rm-rel { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
#dgu-roadmap .rm-rel-list { display: flex; flex-direction: column; gap: 6px; }
#dgu-roadmap .rm-rel-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--rm-line); font-size: 13px; line-height: 1.25; }
#dgu-roadmap .rm-rel-item:hover { border-color: var(--c); background: var(--t); }
#dgu-roadmap .rm-rel-item i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
#dgu-roadmap .rm-rel-item small { color: var(--rm-faint); margin-left: auto; white-space: nowrap; font-size: 11.5px; }
#dgu-roadmap .rm-rel-empty { font-size: 13px; color: var(--rm-faint); }
#dgu-roadmap .rm-m-foot { font-size: 12px; color: var(--rm-faint); margin-top: 18px !important; }
#dgu-roadmap .rm-note { font-size: 12.5px; color: var(--rm-faint); margin-top: 16px !important; max-width: 900px; }

/* ---------- Адаптив ---------- */
@media (max-width: 1100px) {
  #dgu-roadmap { --rm-label: 96px; --rm-lane-min: 132px; }
}
@media (max-width: 760px) {
  #dgu-roadmap { --rm-label: 66px; --rm-lane-min: 150px; padding: 16px 12px 32px; font-size: 14px; }

  #dgu-roadmap .rm-search { flex: 1 1 100%; }
  #dgu-roadmap .rm-legend { gap: 6px 12px; }
  #dgu-roadmap .rm-rowlabel { padding: 12px 6px 12px 2px; }

<script>
/* Дорожная карта ОП — ДГУ. Без зависимостей. Данные: window.DGU_ROADMAP_DATA (только из учебного плана) */
(function () {
  'use strict';

  var DATA = window.DGU_ROADMAP_DATA;
  var root = document.getElementById('dgu-roadmap');
  if (!root || !DATA || !DATA.programs || !DATA.programs.length) return;

  var PALETTE = {
    o1:    { c: '#64748B', t: '#EEF1F5', d: '#334155' },
    o2:    { c: '#0F9488', t: '#CCF2EC', d: '#0B5F57' },
    base:  { c: '#1D5FD6', t: '#DCE8FC', d: '#123E8C' },
    prof:  { c: '#7C3AED', t: '#EDE7FD', d: '#4C1D95' },
    dv:    { c: '#D97706', t: '#FEF3C7', d: '#92400E' },
    prac:  { c: '#16A34A', t: '#DCF5E3', d: '#14532D' },
    extra: { c: '#DB2777', t: '#FCE4F0', d: '#8A1747' }
  };
  var FALLBACK = PALETTE.o1;
  var HOURS = [
    ['lec', 'Лекции', '#1D5FD6'],
    ['lab', 'Лабораторные', '#0F9488'],
    ['pr', 'Практические', '#7C3AED'],
    ['iz', 'ИЗ', '#DB2777'],
    ['krp', 'КРП', '#DB2777'],
    ['self', 'Самостоятельная работа', '#B6C2D4'],
    ['exam', 'Контроль', '#F59E0B']
  ];
  var SHORT_HOURS = { lec: 'лекции', lab: 'лаб.', pr: 'практ.', iz: 'ИЗ', krp: 'КРП', self: 'самост.', exam: 'контроль' };
  var ICON_DOC = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>';
  var ICON_X = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';

  var mqNarrow = window.matchMedia('(max-width: 760px)');
  var state = { pi: 0, track: 'all', query: '', hover: null, pinned: null };
  var P, byCode, trackById, outAdj, inAdj, cardEls, edgeEls, lastOpener, prevOverflow;

  // ---------- утилиты ----------
  function $(name) { return root.querySelector('[data-rm="' + name + '"]'); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function vars(track) { var p = PALETTE[track] || FALLBACK; return '--c:' + p.c + ';--t:' + p.t + ';--d:' + p.d; }
  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }
  function range(arr) { return arr.length > 1 ? arr[0] + '–' + arr[arr.length - 1] : String(arr[0]); }
  function courses(sems) {
    var c = sems.map(function (s) { return Math.ceil(s / 2); });
    c = c.filter(function (v, i) { return c.indexOf(v) === i; });
    return range(c) + ' курс';
  }
  function mainForm(n) {
    if (n.kind === 'gia') return 'защита';
    var f = n.forms || [];
    if (f.indexOf('Экзамен') >= 0) return 'экзамен';
    if (f.indexOf('Зачёт с оценкой') >= 0) return 'зачёт с оц.';
    if (f.indexOf('Зачёт') >= 0) return 'зачёт';
    return '';
  }
  function volume(n) { return n.ze ? n.ze + ' з.е.' : (n.hours ? n.hours + ' ч' : ''); }
  function norm(s) { return String(s || '').toLowerCase().replace(/ё/g, 'е'); }
  function hoursWord(n) { return n + ' ' + plural(n, 'час', 'часа', 'часов'); }

  // ---------- данные программы ----------
  function indexProgram() {
    P = DATA.programs[state.pi];
    byCode = {}; trackById = {};
    P.tracks.forEach(function (t) { trackById[t.id] = t; });
    P.nodes.forEach(function (n) {
      byCode[n.code] = { node: n, parent: null };
      (n.options || []).forEach(function (o) { byCode[o.code] = { node: o, parent: n }; });
    });
    outAdj = {}; inAdj = {};
    (P.edges || []).forEach(function (e) {
      (outAdj[e[0]] = outAdj[e[0]] || []).push(e[1]);
      (inAdj[e[1]] = inAdj[e[1]] || []).push(e[0]);
    });
  }
  function related(code) {
    var set = {}; set[code] = true;
    [outAdj, inAdj].forEach(function (adj) {
      var stack = [code];
      while (stack.length) {
        var c = stack.pop();
        (adj[c] || []).forEach(function (x) { if (!set[x]) { set[x] = true; stack.push(x); } });
      }
    });
    return set;
  }
  function matches(n, q) {
    if (!q) return false;
    var hay = norm(n.name + ' ' + n.code);
    (n.options || []).forEach(function (o) { hay += ' ' + norm(o.name + ' ' + o.code); });
    return hay.indexOf(q) >= 0;
  }
  function summary(code) {
    return (P.summary || []).filter(function (s) { return s.code === code; })[0];
  }

  // ---------- шапка ----------
  function renderHeader() {
    var m = P.meta;
    $('faculty').textContent = m.faculty;
    $('name').textContent = m.code + ' ' + m.title;
    $('profile').textContent = 'Направленность (профиль): ' + m.profile;

    var sw = root.querySelector('.rm-switch');
    sw.style.display = DATA.programs.length > 1 ? '' : 'none';
    sw.innerHTML = DATA.programs.map(function (p, i) {
      return '<button type="button" role="tab" aria-selected="' + (i === state.pi) + '" data-pi="' + i + '">' +
        esc(p.meta.code) + '<small>' + esc(p.meta.short) + '</small></button>';
    }).join('');

    // цифры — из «Сводных данных» учебного плана
    var total = (P.summary || []).filter(function (s) { return /^Итого по ОП/.test(s.name); })[0];
    var stats = [[m.years, plural(m.years, 'год', 'года', 'лет') + ' обучения, ' + m.form.toLowerCase() + ' форма']];
    if (total) stats.push([total.ze, 'з.е. по программе']);
    [['Б1.О', 'з.е. обязательная часть'], ['Б1.В', 'з.е. часть, формируемая участниками образовательных отношений'],
     ['Б2.О', 'з.е. практика'], ['Б3', 'з.е. государственная итоговая аттестация']].forEach(function (x) {
      var s = summary(x[0]);
      if (s) stats.push([s.ze, x[1]]);
    });
    $('stats').innerHTML = stats.map(function (s) { return '<li><b>' + s[0] + '</b><span>' + esc(s[1]) + '</span></li>'; }).join('');
    $('links').innerHTML =
      '<a href="' + esc(m.planUrl) + '" target="_blank" rel="noopener">' + ICON_DOC + 'Учебный план (PDF)</a>' +
      '<span style="color:var(--rm-faint)">' + esc(m.fgos) + ' · набор ' + m.startYear + ' г. · ' + esc(m.approved) + '</span>';
    $('note').textContent = 'Все данные взяты из учебного плана ' + m.code + ' «' + m.title + '», набор ' + m.startYear +
      ' г. (' + m.approved + '). Колонки соответствуют модулям и блокам плана. Стрелки показывают логику обучения: какие дисциплины готовят к следующим. ' +
      'Они составлены по плану и содержанию дисциплин и носят рекомендательный характер.';
  }

  function renderTracks() {
    var html = '<button type="button" class="rm-chip" data-track="all" aria-pressed="' + (state.track === 'all') + '">Все модули</button>';
    P.tracks.forEach(function (t) {
      html += '<button type="button" class="rm-chip" data-track="' + t.id + '" style="' + vars(t.id) + '" aria-pressed="' +
        (state.track === t.id) + '"><i></i>' + esc(t.name) + '</button>';
    });
    $('tracks').innerHTML = html;
  }

  // ---------- сетка ----------
  function cardHtml(n) {
    if (n.kind === 'choice') {
      var head = n.mobility ? 'Модуль мобильности' : 'По выбору';
      var opts = n.options.map(function (o) {
        return '<button type="button" class="rm-opt" data-open="' + esc(o.code) + '">' + esc(o.name) + '</button>';
      }).join('<span class="rm-or">или</span>');
      return '<div class="rm-card rm-card--choice" data-code="' + esc(n.code) + '" style="' + vars(n.track) + '">' +
        '<div class="rm-choice-head">' + head + '<span>' + esc(volume(n)) + (mainForm(n) ? ' · ' + mainForm(n) : '') + '</span></div>' +
        opts + '</div>';
    }
    var compact = trackById[n.track] && trackById[n.track].compact;
    var cls = 'rm-card';
    if (compact) cls += ' rm-card--compact';
    if (n.kind === 'practice') cls += ' rm-card--practice';
    if (n.kind === 'gia') cls += ' rm-card--gia';
    if (n.kind === 'optional') cls += ' rm-card--optional';
    var form = mainForm(n);
    var open = '<button type="button" class="' + cls + '" data-code="' + esc(n.code) + '" data-open="' + esc(n.code) + '" style="' + vars(n.track) + '">';
    if (compact) {
      var bits = [volume(n), form, n.sems.length > 1 ? range(n.sems) + ' сем.' : '', n.kind === 'optional' ? 'факультатив' : '']
        .filter(Boolean).join(' · ');
      return open + '<span class="rm-card-name">' + esc(n.name) + '</span><span class="rm-card-meta">' + esc(bits) + '</span></button>';
    }
    var meta = '<span class="rm-pill">' + esc(volume(n)) + '</span>';
    if (form) meta += '<span class="rm-pill' + (form === 'экзамен' ? ' rm-pill--exam' : '') + '">' + form + '</span>';
    if (n.sems.length > 1) meta += '<span class="rm-pill rm-pill--c">' + range(n.sems) + ' сем.</span>';
    return open + '<span class="rm-card-name">' + esc(n.name) + '</span><span class="rm-card-meta">' + meta + '</span></button>';
  }

  function semSummary(sem) {
    var ze = 0, exams = 0;
    P.nodes.forEach(function (n) {
      if (n.kind === 'optional') return;
      (n.perSem || []).forEach(function (p) {
        if (p.sem !== sem) return;
        ze += p.ze || 0;
        if (p.forms.indexOf('Экзамен') >= 0) exams++;
      });
    });
    return ze + ' з.е. · ' + exams + ' ' + plural(exams, 'экзамен', 'экзамена', 'экзаменов');
  }

  // порядок внутри ячейки: обязательные -> вариативные -> по выбору -> факультативы
  var RANK = { core: 0, practice: 0, gia: 1, variable: 1, sport: 1, choice: 2, optional: 3 };
  function rank(n) { return RANK[n.kind] == null ? 1 : RANK[n.kind]; }

  function renderGrid() {
    var lanes = (mqNarrow.matches && state.track !== 'all')
      ? P.tracks.filter(function (t) { return t.id === state.track; })
      : P.tracks;
    var grid = $('grid');
    root.style.setProperty('--rm-lanes', lanes.length);
    var maxRow = Math.max.apply(null, P.nodes.map(function (n) { return n.start; }));

    var html = '<div class="rm-corner"></div>';
    lanes.forEach(function (t) {
      var cnt = P.nodes.filter(function (n) { return n.track === t.id; }).length;
      html += '<div class="rm-lanehead" data-lane="' + t.id + '" style="' + vars(t.id) + '"><i></i><b>' + esc(t.name) + '</b><span>' +
        esc(t.codes) + ' · ' + cnt + ' ' + plural(cnt, 'блок', 'блока', 'блоков') + '</span></div>';
    });
    for (var row = 1; row <= maxRow; row++) {
      var final = row === 9;
      var course = !final && row % 2 === 1 ? ' rm-course' : '';
      html += final
        ? '<div class="rm-rowlabel rm-rowlabel--final rm-course"><b>Финиш</b><span>итоговая аттестация</span></div>'
        : '<div class="rm-rowlabel' + course + '"><b>' + row + ' семестр</b><span>' + Math.ceil(row / 2) + ' курс · ' +
          (row % 2 ? 'осень' : 'весна') + '</span><em>' + semSummary(row) + '</em></div>';
      lanes.forEach(function (t) {
        var cards = P.nodes.filter(function (n) { return n.start === row && n.track === t.id; })
          .sort(function (a, b) { return rank(a) - rank(b) || b.sems.length - a.sems.length || (a.code < b.code ? -1 : 1); })
          .map(cardHtml).join('');
        html += '<div class="rm-cell' + (final ? ' rm-course' : course) + '">' + cards + '</div>';
      });
    }
    grid.innerHTML = html;
    cardEls = {};
    grid.querySelectorAll('[data-code]').forEach(function (elm) { cardEls[elm.getAttribute('data-code')] = elm; });
    applyState();
    scheduleDraw();
  }

  // ---------- полосы колонок и стрелки ----------
  var drawPending = false;
  function scheduleDraw() {
    if (drawPending) return;
    drawPending = true;
    requestAnimationFrame(function () { drawPending = false; drawEdges(); });
  }

  function drawEdges() {
    var tree = $('tree'), svg = $('edges'), grid = $('grid');
    var W = grid.scrollWidth, H = grid.offsetHeight;
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    var tr = tree.getBoundingClientRect();
    function box(elm) {
      var r = elm.getBoundingClientRect();
      return { l: r.left - tr.left, t: r.top - tr.top, w: r.width, h: r.height, cx: r.left - tr.left + r.width / 2 };
    }

    var out = '<defs>';
    Object.keys(PALETTE).forEach(function (k) {
      out += '<marker id="rm-ah-' + k + '" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">' +
        '<path d="M0 0.5 L10 5 L0 9.5 Z" fill="' + PALETTE[k].c + '"/></marker>';
    });
    out += '</defs>';

    grid.querySelectorAll('.rm-lanehead').forEach(function (h) {
      var b = box(h), p = PALETTE[h.getAttribute('data-lane')] || FALLBACK;
      out += '<rect x="' + (b.l + 3) + '" y="2" width="' + (b.w - 6) + '" height="' + (H - 4) + '" rx="16" fill="' + p.t + '" fill-opacity=".38"/>';
    });

    // точки выхода/входа разносим, чтобы стрелки не сливались
    var boxes = {}, outs = {}, ins = {};
    (P.edges || []).forEach(function (e) {
      if (!cardEls[e[0]] || !cardEls[e[1]]) return;
      boxes[e[0]] = boxes[e[0]] || box(cardEls[e[0]]);
      boxes[e[1]] = boxes[e[1]] || box(cardEls[e[1]]);
      (outs[e[0]] = outs[e[0]] || []).push(e);
      (ins[e[1]] = ins[e[1]] || []).push(e);
    });
    function spread(list, key, otherKey) {
      list.sort(function (a, b) { return boxes[a[otherKey]].cx - boxes[b[otherKey]].cx; });
      var b = boxes[list[0][key]], n = list.length, pos = {};
      list.forEach(function (e, i) {
        var f = n === 1 ? 0.5 : 0.25 + 0.5 * i / (n - 1);
        pos[e[0] + '>' + e[1]] = b.l + b.w * f;
      });
      return pos;
    }
    var xOut = {}, xIn = {};
    Object.keys(outs).forEach(function (k) { var p = spread(outs[k], 0, 1); for (var x in p) xOut[x] = p[x]; });
    Object.keys(ins).forEach(function (k) { var p = spread(ins[k], 1, 0); for (var x in p) xIn[x] = p[x]; });

    edgeEls = [];
    (P.edges || []).forEach(function (e) {
      var a = boxes[e[0]], b = boxes[e[1]];
      if (!a || !b) return;
      var key = e[0] + '>' + e[1];
      var x1 = xOut[key], y1 = a.t + a.h, x2 = xIn[key], y2 = b.t - 1;
      var dy = Math.max(26, Math.min(140, (y2 - y1) * 0.45));
      var track = byCode[e[0]].node.track;
      var p = PALETTE[track] || FALLBACK;
      out += '<path class="rm-edge" data-a="' + esc(e[0]) + '" data-b="' + esc(e[1]) + '" d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
        ' C' + x1.toFixed(1) + ' ' + (y1 + dy).toFixed(1) + ' ' + x2.toFixed(1) + ' ' + (y2 - dy).toFixed(1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1) +
        '" stroke="' + p.c + '" marker-end="url(#rm-ah-' + (PALETTE[track] ? track : 'o1') + ')"/>';
    });
    svg.innerHTML = out;
    svg.querySelectorAll('.rm-edge').forEach(function (el) {
      edgeEls.push({ a: el.getAttribute('data-a'), b: el.getAttribute('data-b'), el: el });
    });
    applyState();
  }

  // ---------- фильтр и поиск ----------
  function applyState() {
    if (!cardEls) return;
    var focus = state.hover || state.pinned;
    var q = norm(state.query), active = null, search = false;
    if (focus && byCode[focus]) {
      active = related(focus);
    } else if (q) {
      active = {}; search = true;
      P.nodes.forEach(function (n) { if (matches(n, q)) active[n.code] = true; });
    } else if (state.track !== 'all') {
      active = {};
      P.nodes.forEach(function (n) { if (n.track === state.track) active[n.code] = true; });
    }
    $('tree').classList.toggle('rm-dim', !!active);
    Object.keys(cardEls).forEach(function (code) {
      var c = cardEls[code];
      c.classList.toggle('is-on', !!(active && active[code]));
      c.classList.toggle('is-self', !!focus && !search && code === focus);
      c.classList.toggle('is-match', search && !!active[code]);
    });
    (edgeEls || []).forEach(function (e) {
      e.el.classList.toggle('is-on', !!(active && active[e.a] && active[e.b]));
    });
    var pinned = state.pinned && byCode[state.pinned];
    root.classList.toggle('rm--pinned', !!pinned);
    if (pinned) {
      var n = pinned.node;
      $('focusname').textContent = n.kind === 'choice' ? n.options.map(function (o) { return o.name; }).join(' / ') : n.name;
    }
  }

  // ---------- модальное окно ----------
  function relItem(code) {
    var n = byCode[code].node;
    var label = n.kind === 'choice' ? 'По выбору: ' + n.options.map(function (o) { return o.name; }).join(' / ') : n.name;
    var target = n.kind === 'choice' ? n.options[0].code : code;
    var when = n.kind === 'gia' ? 'финиш' : range(n.sems) + ' сем.';
    return '<button type="button" class="rm-rel-item" data-goto="' + esc(target) + '" style="' + vars(n.track) + '"><i></i><span>' +
      esc(label) + '</span><small>' + when + '</small></button>';
  }

  function formsSummary(n) {
    var cnt = {}, order = [];
    (n.perSem || []).forEach(function (p) {
      p.forms.forEach(function (f) { if (!cnt[f]) { cnt[f] = 0; order.push(f); } cnt[f]++; });
    });
    if (!order.length) return n.kind === 'gia' ? 'Защита ВКР' : '—';
    return order.map(function (f) { return f + (cnt[f] > 1 ? ' ×' + cnt[f] : ''); }).join(', ');
  }

  function modalHtml(code) {
    var entry = byCode[code], n = entry.node, g = entry.parent, base = g || n;
    var track = trackById[base.track];
    var tags = '<span class="rm-tag rm-tag--c"><i></i>' + esc(track ? track.name : '') + '</span>' +
      '<span class="rm-tag">' + esc(n.part || base.part) + '</span>';
    var when = n.sems.length > 1 ? range(n.sems) + ' семестры' : n.sems[0] + ' семестр';
    var facts =
      '<div class="rm-fact"><span>Когда</span><b>' + when + '</b><span>' + courses(n.sems) + '</span></div>' +
      '<div class="rm-fact"><span>Объём</span><b>' + (n.ze ? n.ze + ' з.е.' : '—') + '</b><span>' + (n.hours ? hoursWord(n.hours) : '') + '</span></div>' +
      '<div class="rm-fact"><span>Аттестация</span><b>' + esc(formsSummary(n)) + '</b></div>';

    var html = '<div class="rm-m-top" style="' + vars(base.track) + '"></div><div class="rm-m-body" style="' + vars(base.track) + '">' +
      '<div class="rm-m-row"><div class="rm-m-tags">' + tags + '</div><button type="button" class="rm-close" data-rm="close" aria-label="Закрыть">' + ICON_X + '</button></div>' +
      '<div class="rm-m-code">' + esc(n.code) + (base.module ? ' · ' + esc(base.module) : '') + '</div>' +
      '<h2 class="rm-m-title" id="rm-modal-title">' + esc(n.name) + '</h2>' +
      '<div class="rm-facts">' + facts + '</div>';

    if (g) {
      var alt = g.options.filter(function (o) { return o.code !== n.code; })[0];
      var what = g.mobility
        ? 'Модуль мобильности: студент выбирает один из двух онлайн-курсов.'
        : 'Дисциплина по выбору: студент изучает одну из двух дисциплин.';
      html += '<div class="rm-sec"><div class="rm-choicebox">' + what + (alt ? ' Вторая: <button type="button" data-goto="' + esc(alt.code) + '">' + esc(alt.name) + '</button>' : '') + '</div></div>';
    }
    if (n.kind === 'optional') {
      html += '<div class="rm-sec"><div class="rm-choicebox">Факультатив: изучается по желанию и не входит в 240 з.е. программы.</div></div>';
    }
    var block = n.kind === 'practice' || n.kind === 'gia';
    if (block) {
      var weeks = (n.perSem || []).map(function (p) { return p.weeks; }).filter(Boolean)[0];
      var w = '';
      if (typeof weeks === 'number') w = weeks + ' ' + plural(weeks, 'неделя', 'недели', 'недель');
      else if (weeks) w = String(weeks).replace(' 1/3', '⅓').replace(' 2/3', '⅔') + ' недели';
      html += '<div class="rm-sec"><div class="rm-choicebox">' +
        (w ? 'Продолжительность: ' + w + '. ' : '') + 'Объём: ' + hoursWord(n.hours) +
        (n.contact ? ', из них контактная работа ' + n.contact + ' ч' : '') + '.</div></div>';
    }

    var hb = n.hoursBy || {}, total = HOURS.reduce(function (s, h) { return s + (hb[h[0]] || 0); }, 0);
    if (total > 0 && !block) {
      var used = HOURS.filter(function (h) { return hb[h[0]]; });
      html += '<div class="rm-sec"><div class="rm-sec-title">Из чего состоят ' + hoursWord(total) +
        (n.contact ? ' · контактная работа ' + n.contact + ' ч' : '') + '</div><div class="rm-bar">' +
        used.map(function (h) {
          return '<i style="flex:' + hb[h[0]] + ';background:' + h[2] + '" title="' + h[1] + ': ' + hb[h[0]] + ' ч"></i>';
        }).join('') + '</div><div class="rm-bar-legend">' +
        used.map(function (h) {
          return '<span><i style="background:' + h[2] + '"></i>' + h[1] + ' <b>' + hb[h[0]] + '</b></span>';
        }).join('') + '</div></div>';
    }

    if (n.perSem && n.perSem.length > 1) {
      html += '<div class="rm-sec"><div class="rm-sec-title">По семестрам</div><div class="rm-sems">' + n.perSem.map(function (p) {
        var parts = HOURS.filter(function (h) { return p[h[0]]; }).map(function (h) { return SHORT_HOURS[h[0]] + ' ' + p[h[0]]; }).join(' · ');
        return '<div class="rm-semrow"><b>' + p.sem + ' семестр</b><span>' + (p.ze ? p.ze + ' з.е.' : '') + (parts ? (p.ze ? ' · ' : '') + parts : '') +
          '</span><em>' + esc(p.forms.join(', ') || 'без аттестации') + '</em></div>';
      }).join('') + '</div></div>';
    }

    var ins = inAdj[base.code] || [], outs = outAdj[base.code] || [];
    html += '<div class="rm-sec rm-rel">' +
      '<div><div class="rm-sec-title">Опирается на</div><div class="rm-rel-list">' +
      (ins.length ? ins.map(relItem).join('') : '<span class="rm-rel-empty">Стартовая дисциплина</span>') + '</div></div>' +
      '<div><div class="rm-sec-title">Готовит к</div><div class="rm-rel-list">' +
      (outs.length ? outs.map(relItem).join('') : '<span class="rm-rel-empty">' + (n.kind === 'gia' ? 'Диплом бакалавра' : 'Завершающая дисциплина') + '</span>') + '</div></div></div>';

    html += '<p class="rm-m-foot">Источник: учебный план ' + esc(P.meta.code) + ', набор ' + P.meta.startYear + ' г.</p></div>';
    return html;
  }

  function openModal(code, opener) {
    if (!byCode[code]) return;
    var modal = $('modal'), panel = $('panel'), wasOpen = modal.classList.contains('is-open');
    if (!wasOpen) lastOpener = opener || document.activeElement;
    panel.innerHTML = modalHtml(code);
    panel.scrollTop = 0;
    if (!wasOpen) {
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
      prevOverflow = document.documentElement.style.overflow;
      document.documentElement.style.overflow = 'hidden';
    }
    panel.focus();
    var entry = byCode[code];
    state.pinned = (entry.parent || entry.node).code;
    state.hover = null;
    applyState();
    setHash(code);
  }

  function closeModal() {
    var modal = $('modal');
    if (!modal.classList.contains('is-open')) return;
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden', 'true');
    document.documentElement.style.overflow = prevOverflow || '';
    setHash(null);
    if (lastOpener && document.body.contains(lastOpener)) lastOpener.focus({ preventScroll: true });
  }

  function setHash(code) {
    if (!window.history || !history.replaceState) return;
    var url = location.pathname + location.search + (code ? '#roadmap=' + encodeURIComponent(P.id + ':' + code) : '');
    history.replaceState(null, '', url);
  }
  function readHash() {
    var m = /#roadmap=([^&]+)/.exec(location.hash);
    if (!m) return;
    var parts = decodeURIComponent(m[1]).split(':');
    var pi = DATA.programs.map(function (p) { return p.id; }).indexOf(parts[0]);
    if (pi < 0) return;
    if (pi !== state.pi) { state.pi = pi; renderAll(); }
    if (byCode[parts[1]]) openModal(parts[1]);
  }

  // ---------- события ----------
  root.addEventListener('click', function (ev) {
    var t = ev.target;
    var sw = t.closest('.rm-switch button');
    if (sw) { state.pi = +sw.getAttribute('data-pi'); state.track = 'all'; state.pinned = null; renderAll(); return; }
    var chip = t.closest('[data-track]');
    if (chip) {
      state.track = chip.getAttribute('data-track'); state.pinned = null;
      renderTracks();
      if (mqNarrow.matches) renderGrid(); else applyState();
      return;
    }
    if (t.closest('[data-rm="close"]')) { closeModal(); return; }
    if (t.closest('[data-rm="unfocus"]')) { state.pinned = null; applyState(); return; }
    var go = t.closest('[data-goto]');
    if (go) { openModal(go.getAttribute('data-goto')); return; }
    var open = t.closest('[data-open]');
    if (open) { openModal(open.getAttribute('data-open'), open); return; }
    if (t.closest('[data-rm="grid"]') && !t.closest('.rm-card') && state.pinned) { state.pinned = null; applyState(); }
  });

  root.addEventListener('pointerover', function (ev) {
    if (ev.pointerType !== 'mouse') return;
    var c = ev.target.closest('[data-rm="grid"] [data-code]');
    var code = c ? c.getAttribute('data-code') : null;
    if (code !== state.hover) { state.hover = code; applyState(); }
  });
  $('grid').addEventListener('pointerleave', function () { if (state.hover) { state.hover = null; applyState(); } });

  $('search').addEventListener('input', function (ev) { state.query = ev.target.value.trim(); state.pinned = null; applyState(); });
  $('search').addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    var first = $('grid').querySelector('.is-match');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
  });

  document.addEventListener('keydown', function (ev) {
    var modal = $('modal');
    if (!modal.classList.contains('is-open')) return;
    if (ev.key === 'Escape') { ev.preventDefault(); closeModal(); return; }
    if (ev.key === 'Tab') {
      var f = $('panel').querySelectorAll('a[href], button');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (ev.shiftKey && (document.activeElement === first || document.activeElement === $('panel'))) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    }
  });

  if (window.ResizeObserver) new ResizeObserver(scheduleDraw).observe($('grid'));
  else window.addEventListener('resize', scheduleDraw);
  var onMq = function () { renderHint(); renderGrid(); };
  if (mqNarrow.addEventListener) mqNarrow.addEventListener('change', onMq); else mqNarrow.addListener(onMq);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleDraw);

  function renderHint() {
    var touch = window.matchMedia('(hover: none)').matches;
    $('hint').textContent = touch
      ? 'Нажмите на блок — откроются подробности, а на дереве подсветится цепочка связей.' +
        (mqNarrow.matches ? ' Дерево листается вбок, кнопки модулей показывают одну колонку.' : '')
      : 'Нажмите на блок, чтобы открыть подробности. Наведите курсор — подсветится вся цепочка связей.';
  }

  function renderAll() {
    renderHint();
    indexProgram();
    renderHeader();
    renderTracks();
    renderGrid();
  }
  renderAll();
  readHash();
})();

</script>
</body>
</html>
